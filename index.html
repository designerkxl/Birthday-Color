<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
  <title>Birthday Color</title>
  <style>
    :root {
      --color: hsl(105, 83%, 69%);
      --on-color: #060606;
      --ink: #17141a;
      --ink-soft: rgba(23, 20, 26, 0.66);
      --line: rgba(23, 20, 26, 0.16);
      --paper: rgba(255, 255, 255, 0.92);
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background-color: var(--color);
      color: var(--on-color);
      font-family: var(--font);
      font-size: 1rem;
      line-height: 1.45;
      transition: background-color 0.4s ease, color 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 3vw, 40px);
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .stage {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(340px, 420px);
      gap: clamp(24px, 5vw, 64px);
      align-items: center;
    }

    .left-side {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand-logo {
      display: inline-block;
      max-width: 180px;
      height: auto;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.12));
    }

    .brand-logo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .date {
      margin: 0 0 0.5rem;
      font-size: clamp(1.2rem, 2.4vw, 1.8rem);
      font-weight: 600;
      opacity: 0.88;
    }

    .hex {
      display: block;
      font-size: clamp(3.5rem, 8vw, 6.5rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }

    .reading-title {
      margin: 0.8rem 0 0.4rem;
      font-size: clamp(1.8rem, 3.5vw, 2.5rem);
      font-weight: 800;
      line-height: 1.15;
    }

    .reading-text {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 50ch;
      opacity: 0.95;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 1.2rem 0 0;
      padding: 0;
      list-style: none;
    }

    .chips li {
      padding: 6px 14px;
      border: 1.5px solid currentColor;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .shadow {
      margin: 1rem 0 0;
      font-size: 0.95rem;
      font-style: italic;
      opacity: 0.9;
    }

    .note {
      margin: 0.6rem 0 0;
      font-size: 0.8rem;
      opacity: 0.75;
    }

    /* Panel */
    .panel {
      padding: clamp(24px, 3.5vw, 36px);
      background: var(--paper);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--ink);
      border-radius: 28px;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.35);
    }

    .panel h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0.3rem 0 1.4rem;
      color: var(--ink-soft);
      font-size: 0.92rem;
    }

    .fields {
      display: grid;
      grid-template-columns: 4.8rem 1fr 5.8rem;
      gap: 10px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink-soft);
    }

    select {
      width: 100%;
      height: 50px;
      padding: 0 12px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mix {
      margin: 1.4rem 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .mix-row {
      display: grid;
      grid-template-columns: 1fr auto;
      row-gap: 6px;
      align-items: baseline;
    }

    .mix-row dt {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .mix-row dt span {
      font-weight: 400;
      color: var(--ink-soft);
    }

    .mix-row dd {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .track {
      grid-column: 1 / -1;
      height: 6px;
      border-radius: 99px;
      background: rgba(23, 20, 26, 0.09);
      overflow: hidden;
    }

    .track i {
      display: block;
      height: 100%;
      width: var(--p, 0%);
      border-radius: 99px;
      background: var(--color);
      transition: width 0.3s ease;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .copy, .btn-share {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .copy {
      border: none;
      background: var(--ink);
      color: #ffffff;
    }

    .copy:hover { background: #2f2a36; }
    .copy:active { transform: scale(0.98); }

    .btn-share {
      background: transparent;
      border: 1.5px solid var(--ink);
      color: var(--ink);
    }

    .btn-share:hover { background: rgba(23, 20, 26, 0.05); }

    .credit {
      margin: 1.2rem 0 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    /* Modal */
    .share-modal {
      border: none;
      border-radius: 20px;
      padding: 0;
      max-width: 440px;
      width: 90vw;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }

    .share-modal::backdrop {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
    }

    .modal-box {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 { margin: 0; font-size: 1.15rem; }
    .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; }

    .canvas-wrap {
      width: 100%;
      height: 50vh;
      display: flex;
      justify-content: center;
      background: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
    }

    .canvas-wrap canvas { height: 100%; width: auto; object-fit: contain; }
    .share-status { margin: 0; font-size: 0.85rem; color: #666; text-align: center; min-height: 1.2em; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button {
      flex: 1; height: 44px; border-radius: 10px; font-weight: 700; cursor: pointer;
    }
    .btn-main { background: var(--ink); color: #fff; border: none; }
    .btn-sub { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); }

    @media (max-width: 860px) {
      .stage {
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="left-side">
      <section class="hero" aria-labelledby="title">
        <!-- Sol Üst Köşe Logo -->
        <header class="brand-header">
  <a href="#" class="brand-logo" aria-label="Birthday Color Ana Sayfa">
    <img src="logo.png" alt="Birthday Color Logo" width="180" height="auto">
  </a>
</header>

        <div class="result" aria-live="polite">
          <p class="date" id="dateText"></p>
          <output class="hex" id="hexText" for="day month year"></output>
          <h2 class="reading-title" id="readingTitle"></h2>
        </div>
      </section>

      <section class="reading" id="reading" aria-labelledby="readingTitle">
        <p class="reading-text" id="readingText"></p>
        <ul class="chips" id="readingChips"></ul>
        <p class="shadow" id="readingShadow"></p>
        <p class="note">Eğlence amaçlı bir yorumdur.</p>
      </section>
    </div>

    <section class="panel" aria-labelledby="panelTitle">
      <h2 id="panelTitle">Doğum tarihini seç</h2>
      <p class="lead">Rengin, doğduğun güne özel olarak hesaplanır.</p>

      <div class="fields">
        <div class="field field-day">
          <label for="day">Gün</label>
          <select id="day" autocomplete="off"></select>
        </div>
        <div class="field field-month">
          <label for="month">Ay</label>
          <select id="month" autocomplete="off"></select>
        </div>
        <div class="field field-year">
          <label for="year">Yıl</label>
          <select id="year" autocomplete="off"></select>
        </div>
      </div>

      <dl class="mix">
        <div class="mix-row" id="rowHue">
          <dt>Gün <span>belirler</span> ton</dt>
          <dd id="hueText"></dd>
          <div class="track"><i></i></div>
        </div>
        <div class="mix-row" id="rowSat">
          <dt>Ay <span>belirler</span> doygunluk</dt>
          <dd id="satText"></dd>
          <div class="track"><i></i></div>
        </div>
        <div class="mix-row" id="rowLight">
          <dt>Yıl <span>belirler</span> açıklık</dt>
          <dd id="lightText"></dd>
          <div class="track"><i></i></div>
        </div>
      </dl>

      <div class="actions">
        <button type="button" class="copy" id="copyBtn">HEX kodunu kopyala</button>
        <button type="button" class="btn-share" id="shareOpen">Görsel olarak paylaş</button>
      </div>
      <p class="sr-only" id="copyStatus" role="status"></p>

      <p class="credit">Design by Digimooz</p>
    </section>
  </main>

  <dialog id="shareDialog" class="share-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Kart Önizleme</h3>
        <button type="button" class="close-btn" id="shareClose" aria-label="Kapat">✕</button>
      </div>
      <div class="canvas-wrap">
        <canvas id="shareCanvas"></canvas>
      </div>
      <p id="shareStatus" class="share-status"></p>
      <div class="modal-actions">
        <button type="button" class="btn-sub" id="shareShuffle">Yenile</button>
        <button type="button" class="btn-main" id="shareDownload">Görseli İndir</button>
      </div>
    </div>
  </dialog>

  <script src="reading.js"></script>
  <script src="share.js"></script>
  <script src="script.js"></script>
</body>
</html>
