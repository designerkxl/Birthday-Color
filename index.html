<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#7a3fc4">
  <title>Doğum Günü Rengi</title>
  <meta name="designer" content="Köksal Akgün">
  <meta name="keywords" content="renkli doğum günü, doğum günü rengi, renk seçici, özel gün renkleri, kişisel renk paleti">
  <meta name="description" content="Renkli Doğum Günü uygulaması ile doğum gününüzü renklerle kutlayın! Gün, ay ve yıl seçerek kişisel renk paletinizi oluşturun ve özel gününüzü daha da anlamlı kılın.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237a3fc4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="stage">
    <section class="hero" aria-labelledby="title">
      <h1 id="title" class="brand">Doğum Günü Rengi</h1>

      <div class="result" aria-live="polite">
        <p class="date" id="dateText"></p>
        <output class="hex" id="hexText" for="day month year"></output>
        <h2 class="reading-title" id="readingTitle"></h2>
      </div>
    </section>

    <section class="panel" aria-labelledby="panelTitle">
      <h2 id="panelTitle">Doğum tarihini seç</h2>
      <p class="lead">Rengin, doğduğun güne özel olarak hesaplanır.</p>

      <div class="fields">
        <div class="field field-day">
          <label for="day">Gün</label>
          <select id="day" autocomplete="off"></select>
        </div>
        <div class="field field-month">
          <label for="month">Ay</label>
          <select id="month" autocomplete="off"></select>
        </div>
        <div class="field field-year">
          <label for="year">Yıl</label>
          <select id="year" autocomplete="off"></select>
        </div>
      </div>

      <dl class="mix">
        <div class="mix-row" id="rowHue">
          <dt>Gün <span>belirler</span> ton</dt>
          <dd id="hueText"></dd>
          <div class="track"><i></i></div>
        </div>
        <div class="mix-row" id="rowSat">
          <dt>Ay <span>belirler</span> doygunluk</dt>
          <dd id="satText"></dd>
          <div class="track"><i></i></div>
        </div>
        <div class="mix-row" id="rowLight">
          <dt>Yıl <span>belirler</span> açıklık</dt>
          <dd id="lightText"></dd>
          <div class="track"><i></i></div>
        </div>
      </dl>

      <button type="button" class="copy" id="copyBtn">HEX kodunu kopyala</button>
      <p class="sr-only" id="copyStatus" role="status"></p>

      <p class="credit">Tasarım: Köksal Akgün</p>
    </section>

    <section class="reading" id="reading" aria-labelledby="readingTitle">
      <p class="reading-text" id="readingText"></p>
      <ul class="chips" id="readingChips"></ul>
      <p class="shadow" id="readingShadow"></p>
      <p class="note">Eğlence amaçlı bir yorumdur.</p>
    </section>
  </main>

  <script src="reading.js"></script>
  <script src="script.js"></script>
</body>

</html>
